name: simple_pip_mode
description: A complete Picture-In-Picutre mode plugin (Android support only)
version: 2.0.0
repository: https://github.com/PuntitOwO/simple_pip_mode_flutter

environment:
  sdk: "^3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: cl.puntito.simple_pip_mode
        pluginClass: SimplePipModePlugin